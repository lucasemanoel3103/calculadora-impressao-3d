<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintCost 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#10141d;color:#e9edf5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:32px;margin:0}h2{font-size:17px;color:#a5b4fc}p,small{color:#aab5c8}section{background:#1b2230;border:1px solid #303a4c;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}label{display:grid;gap:6px;font-size:13px}input,select,button{font:inherit;border:1px solid #43516a;border-radius:8px;padding:10px;background:#101722;color:white;width:100%}button{background:#6366f1;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#344158}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.metric{padding:12px;background:#111827;border-radius:10px}.metric strong{display:block;font-size:24px;color:#a5f3c9;margin-top:5px}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #303a4c}.warn{color:#fbbf24} @media(max-width:750px){.layout{display:block}main{padding:14px}}@media print{body,section,input,select{background:white;color:black}button,#history{display:none}.metric{background:#eee}.metric strong,h2,p,small{color:black}}</style></head><body><main><h1>PrintCost <span style="color:#a5b4fc">3D</span></h1><p>Custos, orçamentos e precificação • Bambu Lab A1 Mini</p><small>Valores iniciais ilustrativos. Ajuste conforme seus custos reais. Todos os custos de produção abaixo são por lote, salvo indicação.</small><div class="layout"><div id="fields"></div><div><section><h2>Resultado do orçamento</h2><div id="result" aria-live="polite"></div><div class="grid" style="margin-top:16px"><button id="save">Salvar orçamento</button><button class="secondary" onclick="window.print()">Imprimir / PDF</button></div></section><section id="history"><h2>Histórico local</h2><div id="records"></div><button class="secondary" id="export">Exportar CSV</button></section></div></div></main><script>
const groups=[['Produto e produção',[['name','Nome da peça','Peça 3D','text'],['material','Material','PETG','text'],['qty','Peças vendáveis no lote',1],['grams','Filamento total (g, incluindo suportes)',50],['hours','Horas de impressão do lote',2],['minutes','Minutos adicionais',0]]],['Material e energia',[['roll','Preço do rolo (R$)',60],['weight','Peso líquido do rolo (g)',1000],['waste','Perda adicional (%)',5],['watts','Potência média medida (W)',100],['tariff','Energia (R$/kWh)',1]]],['Equipamento e acabamento',[['machine','Valor da impressora (R$)',2000],['life','Vida útil estimada (horas)',5000],['maintenance','Manutenção (R$/hora)',0.3],['laborHours','Horas de trabalho manual no lote',0.25],['laborRate','Mão de obra (R$/hora)',20],['finish','Pintura e acessórios do lote (R$)',0],['pack','Embalagem por peça (R$)',2],['extra','Outros custos do lote (R$)',0]]],['Venda e margem',[['channel','Canal de venda','Venda direta','text'],['fee','Comissão / pagamento (%)',0],['tax','Tributos sobre venda (%)',0],['fixed','Taxa fixa por peça (R$)',0],['shipping','Frete pago por você por peça (R$)',0],['margin','Margem líquida desejada (%)',30],['discount','Desconto planejado (%)',0]]]];
const $=id=>document.getElementById(id), money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const defs=groups.flatMap(g=>g[1]);for(const [title,items] of groups){const s=document.createElement('section');const h=document.createElement('h2');h.textContent=title;s.append(h);const grid=document.createElement('div');grid.className='grid';for(const [id,label,value,type] of items){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.id=id;i.type=type||'number';i.value=value;if(!type){i.min=['qty','weight','life'].includes(id)?1:0;i.step=id==='qty'?1:'any';}l.append(i);grid.append(l)}s.append(grid);$('fields').append(s)}
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}function write(key,v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch{alert('Não foi possível salvar no navegador.');return false}}function values(){return Object.fromEntries(defs.map(([id,,,type])=>[id,type?$(id).value:$(id).valueAsNumber]))}function restore(v){for(const [id] of defs)if(v[id]!=null)$(id).value=v[id];calc()}
let current=null;function calc(){const v=values();current=null;$('save').disabled=true;const invalid=defs.some(([id,,,type])=>!type&&(!Number.isFinite(v[id])||!$(id).checkValidity()));const rate=(v.fee+v.tax)/100,m=v.margin/100,d=v.discount/100;if(invalid||rate+m>=1||d>=1){$('result').innerHTML='<p class="warn">Confira os valores: quantidade, peso e vida útil devem ser positivos; taxas + margem devem ser inferiores a 100% e desconto menor que 100%.</p>';return}const t=v.hours+v.minutes/60;const parts=[['Filamento',v.roll/v.weight*v.grams*(1+v.waste/100)],['Energia',v.watts/1000*t*v.tariff],['Depreciação',v.machine/v.life*t],['Manutenção',v.maintenance*t],['Mão de obra',v.laborHours*v.laborRate],['Acabamento',v.finish],['Embalagem',v.pack*v.qty],['Outros',v.extra]];const batch=parts.reduce((a,b)=>a+b[1],0),unit=batch/v.qty,base=unit+v.fixed+v.shipping,min=base/(1-rate),sale=Math.ceil(base/(1-rate-m)/(1-d)*100)/100,paid=sale*(1-d),profit=paid*(1-rate)-base;current={v,batch,unit,min,sale,paid,profit};$('result').innerHTML=`<div class="grid"><div class="metric">Preço anunciado / peça<strong>${money(sale)}</strong></div><div class="metric">Lucro estimado / peça<strong>${money(profit)}</strong></div><div class="metric">Custo produção / peça<strong>${money(unit)}</strong></div><div class="metric">Preço mínimo efetivo<strong>${money(min)}</strong></div></div><h2>Detalhamento do lote</h2>${parts.map(([k,n])=>`<div class="line"><span>${k}</span><span>${money(n)}</span></div>`).join('')}<div class="line">Custo total de produção <b>${money(batch)}</b></div><div class="line">Taxas e tributos / peça <b>${money(paid*rate+v.fixed)}</b></div><div class="line">Frete / peça <b>${money(v.shipping)}</b></div><div class="line">Preço após desconto / peça <b>${money(paid)}</b></div><div class="line">Receita do lote <b>${money(paid*v.qty)}</b></div><div class="line">Lucro do lote <b>${money(profit*v.qty)}</b></div><div class="line">Margem efetiva <b>${paid? (profit/paid*100).toFixed(2):'0'}%</b></div><p><small>Preço mínimo sem lucro, após desconto. Margem calculada sobre receita efetiva. Não inclui custos não informados.</small></p>`;$('save').disabled=false;}
let records=read('printcost-history',[]);if(!Array.isArray(records))records=[];function history(){const el=$('records');el.replaceChildren();if(!records.length)el.textContent='Nenhum orçamento salvo.';records.forEach((r,i)=>{const box=document.createElement('div');box.className='line';const text=document.createElement('span');text.textContent=r.v.name+' • '+money(r.sale)+' • '+r.date;const b=document.createElement('button');b.style.width='auto';b.textContent='Abrir';b.onclick=()=>restore(r.v);const del=document.createElement('button');del.className='secondary';del.style.width='auto';del.textContent='×';del.setAttribute('aria-label','Excluir orçamento');del.onclick=()=>{const next=records.filter((_,j)=>i!==j);if(write('printcost-history',next)){records=next;history()}};box.append(text,b,del);el.append(box)})} $('save').onclick=()=>{if(!current)return;const next=[{...current,date:new Date().toLocaleString('pt-BR')},...records];if(write('printcost-history',next)){records=next;history()}};$('export').onclick=()=>{const rows=[['Data','Peça','Material','Canal','Quantidade','Custo unitário','Preço anunciado','Lucro unitário'],...records.map(r=>[r.date,r.v.name,r.v.material,r.v.channel,r.v.qty,r.unit.toFixed(2),r.sale.toFixed(2),r.profit.toFixed(2)])];const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(';')).join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='orcamentos-3d.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('fields').addEventListener('input',()=>{calc();try{localStorage.setItem('printcost-draft',JSON.stringify(values()))}catch{}});restore(read('printcost-draft',{}));history();</script></body></html>
